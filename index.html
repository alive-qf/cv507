<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>个人简历 — Alive QF</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="container">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <div class="intro">
        <h1 id="name">姓名 / Name</h1>
        <p id="role">全栈开发 · 开源爱好者</p>
        <div class="meta">
          <span id="location">城市 · 国家</span>
          <span>•</span>
          <a id="email" href="mailto:you@example.com">you@example.com</a>
        </div>
        <div class="controls">
          <button id="toggle-theme">切换主题</button>
          <button id="toggle-lang">English</button>
          <button id="download" title="Download / Print">导出 PDF</button>
        </div>
      </div>
    </div>
  </header>

  <nav class="site-nav container">
    <a href="#about">关于</a>
    <a href="#experience">经历</a>
    <a href="#projects">项目</a>
    <a href="#skills">技能</a>
    <a href="#education">教育</a>
    <a href="#contact">联系</a>
  </nav>

  <main class="container">
    <section id="about" class="card">
      <h2>关于我</h2>
      <p id="summary">一段简短的自我介绍，会根据语言切换。</p>
    </section>

    <section id="experience" class="card">
      <h2>工作经历</h2>
      <div id="experience-list" class="timeline"></div>
    </section>

    <section id="projects" class="card">
      <h2>项目</h2>
      <div id="projects-list" class="grid"></div>
    </section>

    <section id="skills" class="card">
      <h2>技能</h2>
      <div class="skill-controls">
        <label>搜索技能：<input id="skill-filter" placeholder="搜索..." /></label>
      </div>
      <div id="skills-list" class="chips"></div>
    </section>

    <section id="education" class="card">
      <h2>教育</h2>
      <div id="education-list"></div>
    </section>

    <section id="contact" class="card">
      <h2>联系我</h2>
      <p>通过邮箱或在页面底部社交链接联系我。</p>
      <div id="social"></div>
    </section>
  </main>

  <footer class="container footer">© <span id="footer-year"></span> Alive QF</footer>

  <script src="app.js" defer></script>
</body>
</html>
